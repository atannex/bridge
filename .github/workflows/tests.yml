name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate, format, analyse, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath
          coverage: none

      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHP syntax
        run: find src config routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Formatting (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan, level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Dependency advisories
        run: composer audit

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
            phpunit: '^11.5'
          - laravel: '13.*'
            testbench: '11.*'
            phpunit: '^12.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
